# Fires once after day 1 if WaterWorkFix companion C# mod is not detected.
# WaterWorkFix sets $waterworkfix_companion_loaded = true on first building tick;
# if the DLL is missing that flag is never set, triggering the install popup.
rule_check_waterworkfix_companion:
  actions:
    - arguments:
        - popup_missing_waterworkfix
      command: OpenPopup
      daysDelay: 0.0
  criteria:
    - '$waterworkfix_companion_loaded == false'
  domain: MISSION
  eventType: GevUniverseDayPassed
  filterKey: null
  filterOnlyPlayerFaction: true
  isPlaceholder: false
  orderId: 1.0
  singleUse: true
